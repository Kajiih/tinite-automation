[project]
name = "tinite-automation"
version = "0.2.5"
description = "Tinite Automation - Amazon VAT Transaction Reporting and ASIN Asset Automation Monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["vat-report", "image-renamer", "b2b-vat", "invoice-downloader", "web-hub"]

[dependency-groups]
dev = ["poethepoet>=0.48.0", "pytest>=8.0.0", "ruff>=0.16.5", "ty>=0.0.75"]

[tool.uv.workspace]
members = ["apps/*", "libs/*"]

[tool.uv.sources]
vat-report = { workspace = true }
image-renamer = { workspace = true }
b2b-vat = { workspace = true }
invoice-downloader = { workspace = true }
web-hub = { workspace = true }

[tool.pytest.ini_options]
addopts = "--durations=10"
testpaths = [
    "libs/vat-report/tests",
    "libs/image-renamer/tests",
    "libs/b2b-vat/tests",
    "libs/invoice-downloader/tests",
    "apps/web-hub/tests",
]
pythonpath = [
    "libs/vat-report/src",
    "libs/image-renamer/src",
    "libs/b2b-vat/src",
    "libs/invoice-downloader/src",
    "apps/web-hub/src",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

    [tool.ruff.lint]
    select = ["ALL"]
    preview = true
    pydocstyle.convention = "google"

    ignore = [
        "CPY",                         # Missing copyright header
        "missing-trailing-comma",      # Trailing comma (conflicts with formatter)
        "undocumented-public-init",    # __init__ missing docstring
        "missing-todo-author",         # Missing author in TODO
        "line-contains-todo",          # Line contains TODO
        "TD",                          # Todo formatting
        "undocumented-public-module",  # Missing docstring in public module
        "undocumented-public-package", # Missing docstring in public package
        "implicit-namespace-package",  # Implicit namespace package
        "print",                       # print found
    ]
    per-file-ignores = { "**/tests/**/*.py" = [
        "assert",
        "magic-value-comparison",
        "undocumented-public-class",
        "undocumented-public-method",
        "undocumented-public-function",
        "missing-return-type-undocumented-public-function",
        "missing-type-function-argument",
        "unused-method-argument",
        "too-many-arguments",
        "too-many-positional-arguments",
    ] }
    future-annotations = true

        [tool.ruff.lint.flake8-annotations]
        mypy-init-return = true

        [tool.ruff.lint.pylint]
        max-args = 10
        max-positional-args = 5

        [tool.ruff.lint.pydoclint]
        ignore-one-line-docstrings = true

        [tool.ruff.lint.flake8-type-checking]
        strict = true

    [tool.ruff.format]
    docstring-code-format = true
    preview = true

[tool.ty.src]
exclude = ["**/.archive/**", "scratch/**"]

[tool.ty.rules]
all = "error"

[tool.poe.tasks]
check-ruff = "ruff check ."
check-format = "ruff format --check ."
check-ty = "ty check"
check-all = ["check-ty", "check-ruff", "check-format"]
format-ruff = "ruff format ."
fix-ruff = "ruff check --fix --unsafe-fixes ."
format = ["format-ruff", "fix-ruff"]
test = "pytest"
all = ["format", "check-all", "test"]
