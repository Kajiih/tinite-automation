[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amazon-vat-report-automation"
version = "0.1.0"
description = "Amazon VAT Transaction Report FC_Transfer price automation and cross-border country summaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
]

[project.scripts]
process-report = "process_report:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["process_report.py"]
