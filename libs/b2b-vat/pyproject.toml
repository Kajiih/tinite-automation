[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b2b-vat"
dynamic = ["version"]
description = "Amazon VAT Report B2B Intra-EU Transaction Filtering & Aggregation Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.version]
path = "../../pyproject.toml"
pattern = 'version = "(?P<version>[^"]+)"'

[project.scripts]
b2b-vat = "b2b_vat.engine:main"

[tool.hatch.build.targets.wheel]
packages = ["src/b2b_vat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
