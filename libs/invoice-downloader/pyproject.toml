[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-downloader"
dynamic = ["version"]
description = "Amazon Seller Central Invoice Downloader with Multi-Browser Session Auto-Detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "b2b-vat",
    "browser-cookie3>=0.19.1",
]

[tool.hatch.version]
path = "../../pyproject.toml"
pattern = 'version = "(?P<version>[^"]+)"'

[tool.uv.sources]
b2b-vat = { workspace = true }

[project.scripts]
invoice-downloader = "invoice_downloader.engine:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
