[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amazon-vat-report-automation"
version = "0.1.0"
description = "Amazon VAT Transaction Report FC_Transfer price automation and cross-border country summaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
process-report = "amazon_vat_automation.process_report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_vat_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
